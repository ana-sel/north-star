<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Compass · Plan · Month</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared/tokens.css"/>
<link rel="stylesheet" href="../shared/components.css"/>
<link rel="stylesheet" href="../shared/you.css"/>
<style>
  .mnote{font-size:var(--fs-xs);color:var(--muted);line-height:1.55;margin:-2px 2px 14px;}
  .pcol.drop{outline:2px dashed var(--accent);outline-offset:3px;border-radius:12px;}
  .pcard{display:flex;gap:9px;align-items:flex-start;}
  .pcard.dragging{opacity:.4;}
  .pcard-ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex-shrink:0;cursor:pointer;margin-top:1px;transition:all .15s;}
  .pcard-ck svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  .pcard.done .pcard-ck{background:var(--accent);border-color:var(--accent);}
  .pcard.done .pcard-ck svg{opacity:1;}
  .pcard-body{flex:1;min-width:0;}
  .pcard-parent{font-size:9px;font-weight:700;color:var(--muted);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pcard-parent b{color:var(--accent);font-weight:800;}
  .pcard-date{font-size:9px;font-weight:600;color:var(--muted);margin-left:auto;}
  .pcard-date.soon{color:#c99554;font-weight:800;}
  .pcard-date.overdue{color:#b0574a;font-weight:800;}
  .pcard-postponed{font-size:8px;font-weight:800;color:#c99554;background:#fef3e2;border-radius:999px;padding:1px 6px;margin-left:4px;}
  .pcol-empty{font-size:var(--fs-xs);color:var(--muted);opacity:.55;text-align:center;padding:13px 6px;border:1px dashed var(--line);border-radius:12px;}
  /* Edit sheet */
  .msheet-back{position:fixed;inset:0;background:rgba(28,27,24,.35);z-index:40;display:none;}
  .msheet-back.open{display:block;}
  .msheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(28,27,24,.2);transform:translateY(100%);transition:transform .22s cubic-bezier(.22,1,.36,1);padding:12px 18px 24px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .msheet.open{transform:translateY(0);}
  .msheet-grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 14px;}
  .msheet-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .msheet-title{font-size:var(--fs-md);font-weight:800;}
  .msheet-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--greige);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:16px;font-family:inherit;flex-shrink:0;}
  .msheet-close:hover{background:var(--line);color:var(--ink);}
  .msheet-horizon{font-size:var(--fs-xs);color:var(--accent);font-weight:700;margin-bottom:12px;}
  .msheet-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .msheet-row:last-child{border-bottom:none;}
  .msheet-lbl{font-size:var(--fs-xs);font-weight:600;color:var(--muted);}
  .msheet-val{font-size:var(--fs-sm);font-weight:700;color:var(--ink);}
  .msheet-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .msheet-btn{display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-family:inherit;font-size:var(--fs-sm);font-weight:600;color:var(--ink);cursor:pointer;text-align:left;}
  .msheet-btn:active{background:var(--greige);}
  .msheet-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;color:var(--muted);}
  .msheet-btn.accent{color:var(--accent);}
  .msheet-btn.accent svg{color:var(--accent);}
  .msheet-btn.done-btn{border-color:#b9cbb2;background:color-mix(in srgb,#6dab5e 10%,transparent);color:#4f8f43;}
  .msheet-btn.done-btn svg{color:#4f8f43;}
  .msheet-btn.danger{color:#b0574a;}
  .msheet-btn.danger svg{color:#b0574a;}
  /* Icon toolbar (compact secondary actions) */
  .icon-bar{display:flex;justify-content:center;gap:6px;margin:14px 0 4px;padding:10px 0;border-top:1px solid var(--line);}
  .ib{display:flex;flex-direction:column;align-items:center;gap:4px;width:54px;padding:8px 4px;border-radius:12px;border:none;background:none;cursor:pointer;font-family:inherit;transition:background .12s;}
  .ib:active{background:var(--greige);}
  .ib .ic{width:20px;height:20px;color:var(--muted);}
  .ib span{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .ib.done-ib .ic{color:#4f8f43;}
  .ib.done-ib span{color:#4f8f43;}
  .ib.danger .ic{color:#b0574a;}
  .ib.danger span{color:#b0574a;}
  /* Pillar picker (shared with Horizon) */
  .sheet-pillars{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .sp-lbl{font-size:var(--fs-xs);font-weight:700;color:var(--muted);width:100%;margin-bottom:2px;}
  .sp-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-family:inherit;font-size:var(--fs-xs);font-weight:700;color:var(--muted);cursor:pointer;}
  .sp-pill::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pc,var(--line));}
  .sp-pill.sel{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--ink);}
  /* FAB + add fields */
  .fab-add{position:fixed;bottom:20px;right:18px;z-index:30;padding:11px 18px;border-radius:999px;border:none;background:var(--btn);color:#fff;font-family:inherit;font-size:var(--fs-sm);font-weight:700;box-shadow:0 4px 16px rgba(36,35,31,.25);cursor:pointer;}
  .add-field{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:var(--fs-sm);background:var(--card);color:var(--ink);outline:none;}
  .add-field:focus{border-color:var(--accent);}
  .add-field-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .add-field-row .sp-lbl{width:auto;margin:0;flex-shrink:0;min-width:64px;}
  .add-field-row .add-field{flex:1;}
</style>
</head>
<body class="screen-body">

  <div class="ylens">
    <div class="ylens-badge"><i class="ic ic-route"></i></div>
    <div>
      <div class="ylens-title">Month</div>
      <div class="ylens-sub">The stretch you're walking now</div>
    </div>
  </div>

  <p class="mnote">Steps you've sent here from your <b>Horizons</b>. Drag a card between columns, or tap its circle to complete it — it updates everywhere at once. <a href="#" onclick="P.reset();return false" style="color:var(--accent);font-weight:700">Reset demo data</a></p>

  <div class="pboard-wrap">
    <div class="pboard" id="board"></div>
  </div>

  <!-- FAB: add one-off task -->
  <button class="fab-add" onclick="openAdd()"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;vertical-align:middle;margin-right:4px;"><path d="M12 5v14M5 12h14"/></svg>Add Task</button>

  <!-- Add-task sheet -->
  <div class="msheet-back" id="addBack" onclick="closeAdd()"></div>
  <div class="msheet" id="addSheet">
    <div class="msheet-grip"></div>
    <div class="msheet-hdr"><div class="msheet-title">New task</div><button class="msheet-close" onclick="closeAdd()">✕</button></div>
    <input id="addName" class="add-field" placeholder="What needs doing?" autocomplete="off" style="margin-bottom:12px;"/>
    <div class="sheet-pillars" id="addPillars"></div>
    <div class="add-field-row"><span class="sp-lbl">Date</span><input id="addDate" class="add-field" type="date"/></div>
    <div class="add-field-row"><span class="sp-lbl">When</span>
      <select id="addBucket" class="add-field">
        <option value="backlog">Backlog</option>
        <option value="month">Planned</option>
        <option value="week" selected>This week</option>
        <option value="today">Today</option>
      </select>
    </div>
    <div class="msheet-btns">
      <button class="btn-prim" onclick="submitAdd()">Add task</button>
    </div>
  </div>

  <!-- Edit sheet -->
  <div class="msheet-back" id="msheetBack" onclick="closeEdit()"></div>
  <div class="msheet" id="msheet">
    <div class="msheet-grip"></div>
    <div class="msheet-hdr"><div class="msheet-title" id="editTitle"></div><button class="msheet-close" onclick="closeEdit()">✕</button></div>
    <div class="msheet-horizon" id="editHorizon"></div>
    <div id="editRows"></div>
    <div class="msheet-btns" id="editBtns"></div>
  </div>

<script src="../shared/plan-data.js"></script>
<script>
const P = window.PlanData;
const COLS = ['backlog','month','week','today','done'];
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>';
const PILLARS = ['health','inner','admin','family','joy','money','contrib'];
const S = {
  pencil:'<svg viewBox="0 0 24 24"><path d="M17 3l4 4L7 21H3v-4L17 3z"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  spark:'<svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  move:'<svg viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l3 3M2 12h20"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return +p[2]+' '+months[+p[1]-1]; }
function dateChip(n){
  if(!n.date) return '';
  const today=new Date(); today.setHours(0,0,0,0);
  const due=new Date(n.date+'T00:00:00');
  const diff=Math.round((due-today)/(1000*60*60*24));
  if(diff<0) return '<span class="pcard-date overdue">overdue '+fmtDate(n.date)+'</span>';
  if(diff<=3) return '<span class="pcard-date soon">due '+fmtDate(n.date)+'</span>';
  return '<span class="pcard-date">'+fmtDate(n.date)+'</span>';
}

function cardsFor(col){ return col==='done' ? P.doneCards() : P.scheduled(col); }

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLS.forEach(col=>{
    const cards = cardsFor(col);
    const colEl = document.createElement('div');
    colEl.className = 'pcol'; colEl.dataset.col = col;
    const isNow = col==='today';
    colEl.innerHTML = '<div class="pcol-head'+(isNow?' is-now':'')+'">'+P.BUCKET_LABEL[col]+
      ' <span class="pcol-count">'+cards.length+'</span></div>';

    cards.forEach(n=>{
      const root = P.rootOf(n.id);
      const pillVar = P.PILLAR_VAR[n.pillar]||'--muted';
      const card = document.createElement('div');
      card.className = 'pcard'+(n.done?' done':'');
      card.draggable = true; card.dataset.id = n.id;
      card.style.setProperty('--pill','var('+pillVar+')');
      card.innerHTML =
        '<div class="pcard-ck">'+CHECK+'</div>'+
        '<div class="pcard-body">'+
          (root && root.id!==n.id ? '<div class="pcard-parent">\u21b3 <b>'+root.name+'</b></div>' : '')+
          '<div class="pcard-title">'+n.name+'</div>'+
          '<div class="pcard-meta"><span class="chip pillar" style="--pill:var('+pillVar+')">'+n.pillar+'</span>'+
            dateChip(n)+
            (n.postponed && n.postponed>=2 ? '<span class="pcard-postponed">'+n.postponed+'\u00d7 postponed</span>' : '')+
          '</div>'+
        '</div>';
      card.querySelector('.pcard-ck').onclick = e=>{ e.stopPropagation(); P.toggleDone(n.id); };
      // tap card → open edit sheet
      card.onclick = ()=> openEdit(n.id);
      card.addEventListener('dragstart', e=>{ card.classList.add('dragging'); e.dataTransfer.setData('text/plain', n.id); });
      card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
      colEl.appendChild(card);
    });

    if(!cards.length){ const e=document.createElement('div'); e.className='pcol-empty'; e.textContent='—'; colEl.appendChild(e); }

    // "Clear done" — removes from board but stays done in Horizon tree
    if(col==='done' && cards.length){
      const clr = document.createElement('button');
      clr.className = 'pcol-empty';
      clr.style.cssText = 'cursor:pointer;color:var(--accent);border-color:var(--accent);font-weight:700;';
      clr.textContent = 'Clear — stays done in Horizon';
      clr.onclick = ()=>{ cards.forEach(n=> P.update(n.id,{bucket:null})); };
      colEl.appendChild(clr);
    }

    colEl.addEventListener('dragover', e=>{ e.preventDefault(); colEl.classList.add('drop'); });
    colEl.addEventListener('dragleave', ()=> colEl.classList.remove('drop'));
    colEl.addEventListener('drop', e=>{
      e.preventDefault(); colEl.classList.remove('drop');
      const id = e.dataTransfer.getData('text/plain'); if(!id) return;
      if(col==='done') P.update(id,{done:true});
      else P.update(id,{bucket:col, done:false});
    });
    board.appendChild(colEl);
  });
}

P.subscribe(render);
render();

// ── Edit sheet (form + icon toolbar) ──
let editId = null;
function openEdit(id){
  const n = P.byId(id); if(!n) return;
  editId = id;
  const root = P.rootOf(id);
  document.getElementById('editTitle').textContent = 'Edit task';
  document.getElementById('editHorizon').textContent = root && root.id!==n.id ? '↳ from '+root.name : '';
  const rows = document.getElementById('editRows');
  let html='<input id="editName" class="add-field" value="'+n.name.replace(/"/g,'&quot;')+'" style="margin-bottom:12px;"/>';
  html+='<div class="sheet-pillars"><span class="sp-lbl">Pillar</span>'+PILLARS.map(p=>'<button class="sp-pill'+(p===n.pillar?' sel':'')+'" style="--pc:var('+P.PILLAR_VAR[p]+')" onclick="setEditPillar(\''+p+'\')">'+p+'</button>').join('')+'</div>';
  html+='<div class="add-field-row"><span class="sp-lbl">Date</span><input id="editDate" class="add-field" type="date" value="'+(n.date||'')+'"/></div>';
  html+='<div class="add-field-row"><span class="sp-lbl">When</span><select id="editBucket" class="add-field">'+
    P.BUCKETS.map(b=>'<option value="'+b+'"'+(b===n.bucket?' selected':'')+'>'+P.BUCKET_LABEL[b]+'</option>').join('')+'</select></div>';
  if(n.postponed && n.postponed>=2) html+='<div style="font-size:var(--fs-xs);color:#c99554;font-weight:700;margin:8px 0;">⚠ '+n.postponed+'× postponed — is something blocking this?</div>';
  rows.innerHTML = html;

  const btns = document.getElementById('editBtns');
  btns.innerHTML = '';
  // Save (primary)
  const saveBtn=document.createElement('button'); saveBtn.className='btn-prim'; saveBtn.textContent='Save';
  saveBtn.onclick=()=>{
    const name=document.getElementById('editName').value.trim();
    const date=document.getElementById('editDate').value||null;
    const bucket=document.getElementById('editBucket').value;
    if(name) P.update(id,{name, date, bucket});
    closeEdit();
  };
  btns.appendChild(saveBtn);
  // Icon toolbar (compact row — uses .ic line icons from you.css)
  const bar=document.createElement('div'); bar.className='icon-bar';
  const ib=(icon,label,fn,cls)=>{const b=document.createElement('button');b.className='ib'+(cls?' '+cls:'');b.innerHTML='<i class="ic ic-'+icon+'"></i><span>'+label+'</span>';b.onclick=fn;bar.appendChild(b);};
  ib('route','Split',()=>openSplitView(id,n));
  ib('spark','AI',()=>openSplitView(id,n,true));
  if(!n.done) ib('check','Done',()=>{P.update(id,{done:true});closeEdit();},'done-ib');
  else ib('check','Undo',()=>{P.update(id,{done:false,bucket:'today'});closeEdit();},'done-ib');
  if(n.bucket==='today'&&!n.done) ib('wind','Later',()=>{if(confirm('Postpone this task?')){P.update(id,{bucket:'backlog',postponed:(n.postponed||0)+1});closeEdit();}});
  ib('x','Delete',()=>{if(confirm('Remove "'+n.name+'"?')){P.remove(id);closeEdit();}},'danger');
  btns.appendChild(bar);
  document.getElementById('msheetBack').classList.add('open');
  document.getElementById('msheet').classList.add('open');
}

// ── Split view (manual + AI) ──
function openSplitView(id, n, useAI){
  closeEdit();
  const suggestions = useAI ? suggestForMonth(n.name) : [];
  let steps = useAI ? suggestions.map(s=>({name:s,keep:true})) : [];
  document.getElementById('editTitle').textContent = 'Split: '+n.name;
  document.getElementById('editHorizon').textContent = 'Break into smaller steps. Each becomes its own card.';
  const rows = document.getElementById('editRows');
  const btns = document.getElementById('editBtns');

  function renderSplit(){
    let html='<div id="splitSteps" style="margin-bottom:10px;">';
    steps.forEach((s,i)=>{
      html+='<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);">'+
        '<span style="flex:1;font-size:var(--fs-sm);font-weight:600;'+(s.keep?'':'color:var(--muted);text-decoration:line-through;')+'">'+s.name+'</span>'+
        '<button onclick="toggleSplitStep('+i+')" style="font-size:var(--fs-xs);font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid '+(s.keep?'var(--accent)':'var(--line)')+';background:'+(s.keep?'var(--accent-soft,#eef1ec)':'var(--greige)')+';color:'+(s.keep?'var(--accent)':'var(--muted)')+';cursor:pointer;font-family:inherit;">'+(s.keep?'Keep':'Removed')+'</button>'+
      '</div>';
    });
    html+='</div>';
    html+='<div style="display:flex;gap:8px;margin-bottom:10px;"><input id="splitInput" class="add-field" placeholder="Add a step…" style="flex:1;margin:0;"/><button onclick="addSplitStep()" style="width:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:18px;color:var(--accent);cursor:pointer;font-family:inherit;">+</button></div>';
    if(useAI) html+='<button onclick="revertAISplit()" style="font-size:var(--fs-xs);font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;margin-bottom:8px;">↺ Revert AI suggestions</button>';
    rows.innerHTML=html;

    btns.innerHTML='';
    const kept=steps.filter(s=>s.keep);
    const applyBtn=document.createElement('button'); applyBtn.className='btn-prim';
    applyBtn.textContent=kept.length?'Split into '+kept.length+' steps':'Add steps above';
    applyBtn.disabled=!kept.length;
    applyBtn.onclick=()=>{
      kept.forEach(s=>P.addChild(id,s.name,{bucket:n.bucket}));
      closeEdit();
    };
    btns.appendChild(applyBtn);
    const back=document.createElement('button'); back.className='msheet-btn'; back.style.cssText='justify-content:center;color:var(--muted);border:none;margin-top:4px;';
    back.innerHTML='<span>Back</span>'; back.onclick=()=>openEdit(id); btns.appendChild(back);
  }

  window.toggleSplitStep=(i)=>{ steps[i].keep=!steps[i].keep; renderSplit(); };
  window.addSplitStep=()=>{ const inp=document.getElementById('splitInput'); const v=inp.value.trim(); if(v){ steps.push({name:v,keep:true}); renderSplit(); } };
  window.revertAISplit=()=>{ steps=steps.filter(s=>!suggestions.includes(s.name)); renderSplit(); };

  renderSplit();
  document.getElementById('msheetBack').classList.add('open');
  document.getElementById('msheet').classList.add('open');
}
function suggestForMonth(name){
  const n=name.toLowerCase();
  if(n.includes('mortgage')||n.includes('loan')) return ['Compare 3 lenders','Get a decision in principle','Book appointment'];
  if(n.includes('research')) return ['List requirements','Read 3 reviews','Make a shortlist'];
  return ['First small step','Middle step','Final step'];
}
// AI preview for Month (same pattern as Horizon)
function setEditPillar(p){ if(editId){ P.update(editId,{pillar:p}); openEdit(editId); } }
function closeEdit(){
  document.getElementById('msheetBack').classList.remove('open');
  document.getElementById('msheet').classList.remove('open');
}

// ── Add one-off task ──
let addPillar='admin';
function openAdd(){
  document.getElementById('addName').value='';
  document.getElementById('addDate').value='';
  document.getElementById('addBucket').value='week';
  const pillars=document.getElementById('addPillars');
  pillars.innerHTML='<span class="sp-lbl">Pillar</span>'+PILLARS.map(p=>'<button class="sp-pill'+(p===addPillar?' sel':'')+'" style="--pc:var('+P.PILLAR_VAR[p]+')" onclick="pickAddPillar(\''+p+'\')">'+p+'</button>').join('');
  document.getElementById('addBack').classList.add('open');
  document.getElementById('addSheet').classList.add('open');
  setTimeout(()=>document.getElementById('addName').focus(),200);
}
function pickAddPillar(p){ addPillar=p; document.querySelectorAll('#addPillars .sp-pill').forEach(x=>x.classList.toggle('sel', x.textContent===p)); }
function closeAdd(){
  document.getElementById('addBack').classList.remove('open');
  document.getElementById('addSheet').classList.remove('open');
}
function submitAdd(){
  const name=document.getElementById('addName').value.trim();
  if(!name) return;
  const date=document.getElementById('addDate').value||null;
  const bucket=document.getElementById('addBucket').value;
  // standalone task = a root with no children (just a leaf sitting on the board)
  const id=P.addRoot(name, {pillar:addPillar, bucket, date, horizon:'this'});
  closeAdd();
}

// ── Touch/pointer drag-to-move (works on mobile + desktop) ──
let dragId=null, ghost=null, startY=0;
document.addEventListener('pointerdown', e=>{
  const card = e.target.closest('.pcard');
  if(!card || e.target.closest('.pcard-ck')) return;
  dragId = card.dataset.id;
  startY = e.clientY;
  // create ghost after a small movement threshold (to avoid stealing taps)
  card.setPointerCapture(e.pointerId);
  card._pid = e.pointerId;
});
document.addEventListener('pointermove', e=>{
  if(!dragId) return;
  if(!ghost && Math.abs(e.clientY - startY) < 8) return; // threshold
  const card = document.querySelector('[data-id="'+dragId+'"]');
  if(!ghost){
    ghost = card.cloneNode(true);
    ghost.style.cssText = 'position:fixed;z-index:99;opacity:.85;pointer-events:none;width:'+card.offsetWidth+'px;transform:rotate(2deg);';
    document.body.appendChild(ghost);
    card.classList.add('dragging');
  }
  ghost.style.left = e.clientX - 40 + 'px';
  ghost.style.top = e.clientY - 20 + 'px';
  // highlight column under pointer
  document.querySelectorAll('.pcol').forEach(col=>{
    const r=col.getBoundingClientRect();
    col.classList.toggle('drop', e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom);
  });
});
document.addEventListener('pointerup', e=>{
  if(!dragId) return;
  const dropCol = document.querySelector('.pcol.drop');
  if(dropCol && ghost){
    const col = dropCol.dataset.col;
    if(col==='done') P.update(dragId, {done:true});
    else P.update(dragId, {bucket:col, done:false});
  }
  if(ghost){ ghost.remove(); ghost=null; }
  document.querySelectorAll('.pcol.drop').forEach(c=>c.classList.remove('drop'));
  document.querySelectorAll('.pcard.dragging').forEach(c=>c.classList.remove('dragging'));
  dragId = null;
});
</script>
</body>
</html>
