<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paths · Concept A · Quiet list</title>
<link rel="stylesheet" href="../shared/health.css">
</head>
<body>
<div class="app">
  <div data-status></div>

  <header class="header">
    <h1 class="title">You</h1>
    <a class="icon-btn" href="settings.html" aria-label="Settings"><svg class="i"><use href="#i-sliders"/></svg></a>
  </header>
  <div class="seg"><a href="you-progress.html">Progress</a><a class="on">Paths</a></div>

  <!-- Only what you are walking, then two doors. -->
  <div class="sec first"><h2>Walking now</h2><span class="meta">2 of 3</span></div>
  <div class="list">
    <a class="row" href="path-detail.html">
      <span class="tile" style="background:var(--inward)"><svg class="i"><use href="#i-moon"/></svg></span>
      <div class="txt"><div class="t">Stillness</div><div class="s">Doing · 5 returns</div>
        <div class="steps mini" style="color:var(--inward)"><i><b style="width:100%"></b></i><i><b style="width:33%"></b></i><i></i></div></div>
      <svg class="chev"><use href="#i-chev"/></svg>
    </a>
    <a class="row" href="foundation-detail.html">
      <span class="tile" style="background:var(--foundation)"><svg class="i"><use href="#i-layers"/></svg></span>
      <div class="txt"><div class="t">Regulate</div><div class="s">Watching · 2 returns</div>
        <div class="steps mini" style="color:var(--foundation)"><i><b style="width:67%"></b></i><i></i><i></i></div></div>
      <svg class="chev"><use href="#i-chev"/></svg>
    </a>
    <a class="row action" href="#explore">
      <span class="tile empty"><svg class="i"><use href="#i-plus"/></svg></span>
      <span class="txt t">One slot open</span>
    </a>
  </div>

  <div class="sec" id="explore"><h2>Explore</h2></div>
  <div class="list">
    <a class="row" href="paths-inward.html">
      <span class="tile" style="background:linear-gradient(135deg,var(--inward) 0 25%,var(--together) 25% 50%,var(--craft) 50% 75%,var(--frontier) 75%)"><svg class="i"><use href="#i-compass"/></svg></span>
      <div class="txt"><div class="t">Growth paths</div><div class="s">14 qualities in 4 areas</div></div>
      <svg class="chev"><use href="#i-chev"/></svg>
    </a>
    <a class="row" href="foundations-ladder.html">
      <span class="tile" style="background:var(--foundation)"><svg class="i"><use href="#i-layers"/></svg></span>
      <div class="txt"><div class="t">Foundations</div><div class="s">13 basics in 5 tiers</div></div>
      <svg class="chev"><use href="#i-chev"/></svg>
    </a>
  </div>
  <p class="foot">Not sure? Foundations are the floor. Start there, or with one quality that matters this month.</p>
</div>

<nav data-tabbar="you"></nav>
<script src="../shared/shell.js"></script>
</body>
</html>
