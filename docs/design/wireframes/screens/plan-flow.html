<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Compass · Plan · Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../shared/tokens.css"/>
<link rel="stylesheet" href="../shared/components.css"/>
<link rel="stylesheet" href="../shared/you.css"/>
<style>
  /* ── Pillar filter ── */
  .pf-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;flex-shrink:0;}
  .pf-row::-webkit-scrollbar{display:none;}
  .pf-pill{padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-family:inherit;font-size:var(--fs-xs);font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .1s;}
  .pf-pill::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pc,var(--line));margin-right:4px;vertical-align:middle;}
  .pf-pill.all-pill::before{display:none;}
  .pf-pill.on{border-color:var(--pc,var(--accent));background:color-mix(in srgb,var(--pc,#768471) 14%,transparent);color:var(--ink);}

  /* ── WIP nudge ── */
  .wip-nudge{
    background:color-mix(in srgb,#c99554 10%,transparent);
    border:1px solid #c99554;border-radius:10px;
    padding:7px 10px;font-size:var(--fs-xs);font-weight:600;color:#8a6020;
    margin-bottom:8px;display:none;align-items:center;gap:8px;
  }
  .wip-nudge.show{display:flex;}
  .wip-nudge button{margin-left:auto;border:none;background:none;cursor:pointer;font-size:13px;color:#8a6020;padding:0;}

  /* ── Board columns ── */
  .pboard-wrap{overflow-x:auto;padding-bottom:4px;flex-shrink:0;}
  .pboard-wrap::-webkit-scrollbar{height:4px;}
  .pboard-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
  .pboard{display:flex;gap:10px;min-width:max-content;}
  .pcol{width:152px;flex-shrink:0;}
  .pcol-head{font-size:var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .pcol-head.is-now{color:var(--accent);border-color:var(--accent);}
  .pcol-count{font-size:9px;font-weight:700;background:var(--greige);border-radius:99px;padding:1px 6px;color:var(--muted);}
  .pcol.drop{outline:2px dashed var(--accent);outline-offset:3px;border-radius:12px;}

  /* ── Board cards ── */
  .pcard{display:flex;gap:7px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 9px 8px 12px;margin-bottom:7px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;}
  .pcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pill,var(--line));}
  .pcard.dragging{opacity:.35;}
  .pcard-ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex-shrink:0;cursor:pointer;margin-top:1px;transition:all .15s;}
  .pcard-ck svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
  .pcard.done .pcard-ck{background:var(--accent);border-color:var(--accent);}
  .pcard.done .pcard-ck svg{opacity:1;}
  .pcard-body{flex:1;min-width:0;}
  .pcard-parent{font-size:9px;font-weight:700;color:var(--muted);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pcard-parent b{color:var(--accent);font-weight:800;}
  .pcard-title{font-size:var(--fs-sm);font-weight:700;line-height:1.3;margin-bottom:4px;}
  .pcard.done .pcard-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
  .pcard-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .pcard-date{font-size:9px;font-weight:600;color:var(--muted);}
  .pcard-date.decision{color:#c99554;font-weight:800;}
  .pcard-postponed{font-size:8px;font-weight:800;color:#c99554;background:#fef3e2;border-radius:999px;padding:1px 5px;}
  .pcard-notes{font-size:9px;color:var(--muted);margin-left:auto;flex-shrink:0;}
  /* energy badge */
  .ebadge{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-size:7px;font-weight:900;flex-shrink:0;}
  .ebadge.H{background:#e8f0e6;color:#4a7c40;}
  .ebadge.M{background:#fef3e2;color:#8a6020;}
  .ebadge.L{background:var(--greige);color:var(--muted);}
  .pcol-empty{font-size:var(--fs-xs);color:var(--muted);opacity:.5;text-align:center;padding:13px 6px;border:1px dashed var(--line);border-radius:12px;}

  /* ── Later tray ── */
  .later-tray{margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .later-head{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--card);cursor:pointer;user-select:none;}
  .later-chev{font-size:11px;color:var(--muted);transition:transform .15s;}
  .later-tray.open .later-chev{transform:rotate(90deg);}
  .later-label{font-size:var(--fs-xs);font-weight:800;color:var(--ink);flex:1;}
  .later-count{font-size:9px;font-weight:700;background:var(--greige);border-radius:99px;padding:2px 7px;color:var(--muted);}
  .later-body{display:none;padding:10px 14px 14px;}
  .later-tray.open .later-body{display:block;}
  .later-section-head{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:10px 0 6px;display:flex;align-items:center;gap:8px;}
  .later-section-head:first-child{margin-top:0;}
  .later-section-head::after{content:'';flex:1;height:1px;background:var(--line);}
  .later-month-head{font-size:var(--fs-xs);font-weight:700;color:var(--muted);margin:8px 0 5px;}
  .later-card{display:flex;align-items:flex-start;gap:7px;background:var(--greige);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;border:1px solid transparent;}
  .later-card:hover{border-color:var(--line);}
  .later-card .pcard-ck{background:var(--card);}
  .later-card .pcard-body{flex:1;min-width:0;}

  /* ── Edit bottom sheet ── */
  .msheet-back{position:fixed;inset:0;background:rgba(28,27,24,.35);z-index:40;display:none;}
  .msheet-back.open{display:block;}
  .msheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(28,27,24,.2);transform:translateY(100%);transition:transform .22s cubic-bezier(.22,1,.36,1);padding:12px 18px 24px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .msheet.open{transform:translateY(0);}
  .msheet-grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 14px;}
  .msheet-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .msheet-title{font-size:var(--fs-md);font-weight:800;}
  .msheet-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--greige);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:16px;font-family:inherit;}
  .msheet-horizon{font-size:var(--fs-xs);color:var(--accent);font-weight:700;margin-bottom:12px;}
  .add-field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:var(--fs-sm);font-weight:400;background:var(--card);color:var(--ink);outline:none;box-sizing:border-box;transition:border-color .15s,box-shadow .15s;}
  .add-field::placeholder{color:var(--muted);opacity:.7;}
  .add-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(118,132,113,.10);}
  .field-label{font-size:var(--fs-xs);font-weight:700;color:var(--muted);margin:10px 0 6px;}
  /* pillar multiselect in sheet */
  .sheet-pillars{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px;}
  .sp-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-family:inherit;font-size:var(--fs-xs);font-weight:700;color:var(--muted);cursor:pointer;}
  .sp-pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--pc,var(--line));}
  .sp-pill.sel{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--ink);}
  /* scope pills in sheet */
  .scope-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px;}
  .sc-pill{padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-family:inherit;font-size:var(--fs-xs);font-weight:700;color:var(--muted);cursor:pointer;}
  .sc-pill.sel{border-color:var(--accent);background:color-mix(in srgb,#768471 14%,transparent);color:var(--ink);}
  /* energy pills in sheet */
  .energy-row{display:flex;gap:6px;margin-bottom:4px;}
  .en-pill{flex:1;padding:7px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-family:inherit;font-size:var(--fs-xs);font-weight:800;color:var(--muted);cursor:pointer;text-align:center;}
  .en-pill.H.sel{border-color:#4a7c40;background:#e8f0e6;color:#4a7c40;}
  .en-pill.M.sel{border-color:#c99554;background:#fef3e2;color:#8a6020;}
  .en-pill.L.sel{border-color:var(--muted);background:var(--greige);color:var(--ink);}
  .date-row{display:flex;gap:8px;margin-bottom:4px;}
  .date-row .add-field{margin:0;}
  /* icon toolbar */
  .icon-bar{display:flex;justify-content:center;gap:6px;margin:14px 0 4px;padding:10px 0;border-top:1px solid var(--line);}
  .ib{display:flex;flex-direction:column;align-items:center;gap:4px;width:54px;padding:8px 4px;border-radius:12px;border:none;background:none;cursor:pointer;font-family:inherit;transition:background .12s;}
  .ib:active{background:var(--greige);}
  .ib .ic{width:20px;height:20px;color:var(--muted);}
  .ib span{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .ib.done-ib .ic,.ib.done-ib span{color:#4f8f43;}
  .ib.danger .ic,.ib.danger span{color:#b0574a;}
  /* split sheet */
  .split-step-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
  .split-step-name{flex:1;font-size:var(--fs-sm);font-weight:600;}
  .split-step-name.off{color:var(--muted);text-decoration:line-through;}
  .split-keep-btn{font-size:var(--fs-xs);font-weight:700;padding:3px 9px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;}
  /* primary button */
  .btn-prim{width:100%;padding:13px;border-radius:13px;border:none;background:var(--btn);color:#FBFAF8;font-family:inherit;font-size:var(--fs-sm);font-weight:700;cursor:pointer;margin-top:6px;}
  .btn-prim:active{opacity:.85;}
  .undo-toast{
    position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#FBFAF8;padding:10px 18px;border-radius:12px;
    font-size:var(--fs-sm);font-weight:700;z-index:90;
    display:flex;align-items:center;gap:12px;
    opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap;
  }
  .undo-toast.show{opacity:1;pointer-events:auto;}
  .undo-toast button{background:none;border:none;color:var(--accent);font-weight:800;font-family:inherit;font-size:var(--fs-sm);cursor:pointer;padding:0;}
</style>
</head>
<body class="screen-body">

  <div class="ylens">
    <div class="ylens-badge"><i class="ic ic-route"></i></div>
    <div>
      <div class="ylens-title">Flow</div>
      <div class="ylens-sub">What's moving right now</div>
    </div>
  </div>

  <!-- Pillar filter -->
  <div class="pf-row" id="pillarFilter"></div>

  <!-- WIP nudge -->
  <div class="wip-nudge" id="wipNudge">
    <span id="wipMsg"></span>
    <button onclick="dismissWip()" title="Dismiss">✕</button>
  </div>

  <!-- Board -->
  <div class="pboard-wrap">
    <div class="pboard" id="board"></div>
  </div>

  <!-- Later tray -->
  <div class="later-tray" id="laterTray">
    <div class="later-head" onclick="toggleLater()">
      <span class="later-chev">▶</span>
      <span class="later-label">Planned for later</span>
      <span class="later-count" id="laterCount">0</span>
    </div>
    <div class="later-body" id="laterBody"></div>
  </div>

  <!-- Edit sheet -->
  <div class="msheet-back" id="msheetBack" onclick="tryCloseEdit()"></div>
  <div class="msheet" id="msheet">
    <div class="msheet-grip"></div>
    <div class="msheet-hdr">
      <div class="msheet-title" id="editTitle"></div>
      <button class="msheet-close" onclick="forceCloseEdit()">✕</button>
    </div>
    <div class="msheet-horizon" id="editParent"></div>
    <div id="editBody"></div>
    <div id="editActions"></div>
  </div>

  <!-- Undo toast -->
  <div class="undo-toast" id="undoToast">
    <span id="undoMsg">Removed.</span>
    <button onclick="doUndo()">Undo</button>
  </div>

<script src="../shared/plan-data.js"></script>
<script>
const P = window.PlanData;
const PILLARS = P.PILLARS;
const PILLAR_VAR = P.PILLAR_VAR;
const PILLAR_LABEL = P.PILLAR_LABEL;
const SCOPE_LABEL = P.SCOPE_LABEL;

const BOARD_COLS = ['month','week','today','done'];
const COL_LABEL  = { month:'Month', week:'This Week', today:'Today', done:'Done' };
const CHECK_SVG  = '<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>';

let activePillarFilter = 'all';
let wipDismissed = false;
let editId = null;
let editDirty = false;
let undoStack = null;

// ── Helpers ───────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '';
  const [,m,day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return +day + ' ' + months[+m-1];
}
function isDecision(n) {
  if (!n.date) return false;
  return n.date < new Date().toISOString().slice(0,10);
}
function pillarsVar(n) {
  const p = (n.pillars && n.pillars[0]) ? n.pillars[0] : null;
  return p ? 'var(' + PILLAR_VAR[p] + ')' : 'var(--line)';
}
function pillarChips(n) {
  return (n.pillars || []).map(p =>
    `<span class="chip pillar" style="--pill:var(${PILLAR_VAR[p] || '--muted'});">${PILLAR_LABEL[p] || p}</span>`
  ).join('');
}
function matchesPillarFilter(n) {
  if (activePillarFilter === 'all') return true;
  return (n.pillars || []).includes(activePillarFilter);
}

// ── Pillar filter ──────────────────────────────────────────────
function renderPillarFilter() {
  const el = document.getElementById('pillarFilter');
  let html = `<button class="pf-pill all-pill${activePillarFilter==='all'?' on':''}" onclick="setPillarFilter('all')">All</button>`;
  PILLARS.forEach(p => {
    const css = `var(${PILLAR_VAR[p]})`;
    html += `<button class="pf-pill${activePillarFilter===p?' on':''}" style="--pc:${css}" onclick="setPillarFilter('${p}')">${PILLAR_LABEL[p]}</button>`;
  });
  el.innerHTML = html;
}
function setPillarFilter(p) { activePillarFilter = p; render(); }

// ── Board ──────────────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  BOARD_COLS.forEach(col => {
    const allCards = col === 'done' ? P.doneCards() : P.boardItems(col);
    const cards = allCards.filter(matchesPillarFilter);
    const colEl = document.createElement('div');
    colEl.className = 'pcol'; colEl.dataset.col = col;
    colEl.innerHTML = `<div class="pcol-head${col==='today'?' is-now':''}">${COL_LABEL[col]}<span class="pcol-count">${cards.length}</span></div>`;

    cards.forEach(n => {
      const root = P.rootOf(n.id);
      const card = document.createElement('div');
      card.className = 'pcard' + (n.done ? ' done' : '');
      card.draggable = true; card.dataset.id = n.id;
      card.style.setProperty('--pill', pillarsVar(n));
      const dec = !n.done && isDecision(n);
      const dateStr = n.date ? `<span class="pcard-date${dec?' decision':''}">${dec ? 'decide · ' : ''}${fmtDate(n.date)}</span>` : '';
      const energyBadge = n.energyLevel ? `<span class="ebadge ${n.energyLevel}">${n.energyLevel}</span>` : '';
      const postponeBadge = (n.postponed||0) >= 2 ? `<span class="pcard-postponed">${n.postponed}× delayed</span>` : '';
      const notesBadge = n.notes ? '<span class="pcard-notes">📝</span>' : '';
      card.innerHTML =
        `<div class="pcard-ck">${CHECK_SVG}</div>` +
        `<div class="pcard-body">` +
          (root && root.id !== n.id ? `<div class="pcard-parent">↳ <b>${root.name}</b></div>` : '') +
          `<div class="pcard-title">${n.name}</div>` +
          `<div class="pcard-meta">${pillarChips(n)}${dateStr}${energyBadge}${postponeBadge}${notesBadge}</div>` +
        `</div>`;
      card.querySelector('.pcard-ck').addEventListener('click', e => { e.stopPropagation(); P.toggleDone(n.id); });
      card.addEventListener('click', () => openEdit(n.id));
      card.addEventListener('dragstart', e => { card.classList.add('dragging'); e.dataTransfer.setData('text/plain', n.id); });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      colEl.appendChild(card);
    });

    if (!cards.length) {
      const emp = document.createElement('div'); emp.className = 'pcol-empty'; emp.textContent = '—'; colEl.appendChild(emp);
    }

    // Done column clear button
    if (col === 'done' && cards.length) {
      const clr = document.createElement('button');
      clr.className = 'pcol-empty'; clr.style.cssText = 'cursor:pointer;color:var(--accent);border-color:var(--accent);font-weight:700;width:100%;';
      clr.textContent = 'Clear done'; clr.onclick = () => cards.forEach(n => P.update(n.id, {bucket: null}));
      colEl.appendChild(clr);
    }

    // Drag-drop
    colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('drop'); });
    colEl.addEventListener('dragleave', () => colEl.classList.remove('drop'));
    colEl.addEventListener('drop', e => {
      e.preventDefault(); colEl.classList.remove('drop');
      const id = e.dataTransfer.getData('text/plain'); if (!id) return;
      if (col === 'done') P.update(id, {done: true, completedDate: new Date().toISOString().slice(0,10)});
      else P.update(id, {bucket: col, done: false, completedDate: null});
    });
    board.appendChild(colEl);
  });

  // WIP nudge
  const todayCount = P.boardItems('today').filter(matchesPillarFilter).length;
  const nudge = document.getElementById('wipNudge');
  const msg   = document.getElementById('wipMsg');
  if (todayCount >= 3 && !wipDismissed) {
    nudge.classList.add('show');
    msg.textContent = todayCount >= 5
      ? `You have ${todayCount} items in Today. What are the 3 most important?`
      : `Your hands are full. Finish something first, or move it back.`;
  } else {
    nudge.classList.remove('show');
  }
}
function dismissWip() { wipDismissed = true; document.getElementById('wipNudge').classList.remove('show'); }

// ── Later tray ─────────────────────────────────────────────────
function renderLater() {
  const items = P.laterItems().filter(matchesPillarFilter);
  document.getElementById('laterCount').textContent = items;
  document.getElementById('laterCount').textContent = items.length;
  const body = document.getElementById('laterBody');

  // Group by scope, then by month for 'year' items
  const yearItems    = items.filter(n => n.bucket === 'year');
  const somedayItems = items.filter(n => n.bucket === 'someday');

  // Sub-group year items by month
  const byMonth = {};
  const noDate  = [];
  yearItems.forEach(n => {
    if (n.date) {
      const key = n.date.slice(0,7); // YYYY-MM
      (byMonth[key] = byMonth[key] || []).push(n);
    } else { noDate.push(n); }
  });

  let html = '';

  if (yearItems.length) {
    html += `<div class="later-section-head">This Year</div>`;
    const months = Object.keys(byMonth).sort();
    months.forEach(m => {
      const label = new Date(m + '-01T00:00:00').toLocaleString('en', {month:'long'});
      html += `<div class="later-month-head">${label}</div>`;
      html += byMonth[m].map(n => laterCardHtml(n)).join('');
    });
    if (noDate.length) {
      html += `<div class="later-month-head" style="color:var(--muted);font-style:italic">No date yet</div>`;
      html += noDate.map(n => laterCardHtml(n)).join('');
    }
  }

  if (somedayItems.length) {
    html += `<div class="later-section-head">Someday</div>`;
    html += somedayItems.map(n => laterCardHtml(n)).join('');
  }

  if (!items.length) {
    html = `<div style="font-size:var(--fs-xs);color:var(--muted);text-align:center;padding:12px 0">Nothing parked for later.</div>`;
  }

  body.innerHTML = html;
  body.querySelectorAll('.later-card').forEach(el => {
    el.addEventListener('click', () => openEdit(el.dataset.id));
  });
}

function laterCardHtml(n) {
  const root = P.rootOf(n.id);
  const dec  = isDecision(n);
  return `<div class="later-card" data-id="${n.id}" style="--pill:${pillarsVar(n)}">` +
    `<div class="pcard-ck" style="pointer-events:none">${CHECK_SVG}</div>` +
    `<div class="pcard-body">` +
      (root && root.id !== n.id ? `<div class="pcard-parent">↳ <b>${root.name}</b></div>` : '') +
      `<div class="pcard-title">${n.name}</div>` +
      `<div class="pcard-meta">${pillarChips(n)}${n.date ? `<span class="pcard-date${dec?' decision':''}">${dec?'decide · ':''}${fmtDate(n.date)}</span>` : ''}</div>` +
    `</div></div>`;
}

function toggleLater() {
  document.getElementById('laterTray').classList.toggle('open');
}

// ── First-use hint for Later tray ─────────────────────────────
(function() {
  const key = 'compass.later.hinted';
  function checkHint() {
    if (localStorage.getItem(key)) return;
    const later = P.laterItems();
    if (!later.length) return;
    const tray = document.getElementById('laterTray');
    tray.style.transition = 'box-shadow .4s';
    tray.style.boxShadow  = '0 0 0 2px var(--accent)';
    const head = tray.querySelector('.later-label');
    if (head) head.textContent = 'Items planned for later live here — tap to see';
    setTimeout(() => { tray.style.boxShadow = ''; if (head) head.textContent = 'Planned for later'; localStorage.setItem(key, '1'); }, 4000);
  }
  P.subscribe(checkHint);
  checkHint();
})();

// ── Edit sheet ─────────────────────────────────────────────────
function openEdit(id) {
  const n = P.byId(id); if (!n) return;
  editId = id; editDirty = false;
  const root = P.rootOf(id);
  document.getElementById('editTitle').textContent = 'Edit task';
  document.getElementById('editParent').textContent = root && root.id !== id ? '↳ from ' + root.name : '';
  buildEditBody(n);
  buildEditActions(n);
  document.getElementById('msheetBack').classList.add('open');
  document.getElementById('msheet').classList.add('open');
}

function buildEditBody(n) {
  const body = document.getElementById('editBody');
  const scopeOpts = P.SCOPES.map(s =>
    `<button class="sc-pill${n.bucket===s?' sel':''}" onclick="setEditScope('${s}')">${P.SCOPE_LABEL[s]}</button>`
  ).join('');
  const energyOpts = ['H','M','L'].map(e =>
    `<button class="en-pill ${e}${n.energyLevel===e?' sel':''}" onclick="setEditEnergy('${e}')">${e==='H'?'High':e==='M'?'Medium':'Low'}</button>`
  ).join('');
  const pillarsHtml = P.PILLARS.map(p =>
    `<button class="sp-pill${(n.pillars||[]).includes(p)?' sel':''}" style="--pc:var(${PILLAR_VAR[p]})" onclick="toggleEditPillar('${p}')">${PILLAR_LABEL[p]}</button>`
  ).join('');

  body.innerHTML =
    `<input id="editName" class="add-field" value="${(n.name||'').replace(/"/g,'&quot;')}" style="margin-bottom:10px;" oninput="editDirty=true"/>` +
    `<div class="field-label">Life area</div>` +
    `<div class="sheet-pillars">${pillarsHtml}</div>` +
    `<div class="field-label">Energy</div>` +
    `<div class="energy-row">${energyOpts}</div>` +
    `<div class="field-label">When?</div>` +
    `<div class="scope-row">${scopeOpts}</div>` +
    `<div class="date-row"><input type="date" id="editDate" class="add-field" value="${n.date||''}"/><input type="time" id="editTime" class="add-field" style="width:100px;flex-shrink:0" value="${n.time||''}"/></div>` +
    `<div class="field-label">Done when</div>` +
    `<input id="editDoneWhen" class="add-field" placeholder="How will you know it's done?" value="${(n.doneWhen||'').replace(/"/g,'&quot;')}" style="margin-bottom:10px;"/>` +
    `<div class="field-label">Notes</div>` +
    `<textarea id="editNotes" class="add-field" rows="2" placeholder="Context, links, thoughts…" style="resize:vertical">${n.notes||''}</textarea>`;
}

function buildEditActions(n) {
  const actions = document.getElementById('editActions');
  actions.innerHTML = '';
  const saveBtn = document.createElement('button'); saveBtn.className = 'btn-prim'; saveBtn.textContent = 'Save';
  saveBtn.onclick = saveEdit;
  actions.appendChild(saveBtn);

  const bar = document.createElement('div'); bar.className = 'icon-bar';
  const ib = (icon, label, fn, cls) => {
    const b = document.createElement('button'); b.className = 'ib' + (cls ? ' ' + cls : '');
    b.innerHTML = `<i class="ic ic-${icon}"></i><span>${label}</span>`; b.onclick = fn; bar.appendChild(b);
  };
  ib('route', 'Split', () => openSplit(n.id, n));
  ib('spark', 'AI split', () => openSplit(n.id, n, true));
  if (!n.done) ib('check', 'Done', () => { P.toggleDone(n.id); forceCloseEdit(); }, 'done-ib');
  else         ib('check', 'Undo', () => { P.toggleDone(n.id); forceCloseEdit(); }, 'done-ib');
  ib('x', 'Delete', () => confirmDelete(n.id), 'danger');
  actions.appendChild(bar);
}

function setEditScope(s) {
  if (!editId) return;
  editDirty = true;
  document.querySelectorAll('.sc-pill').forEach(b => b.classList.toggle('sel', b.textContent === P.SCOPE_LABEL[s]));
  document.querySelectorAll('.sc-pill').forEach(b => b.onclick = () => setEditScope(b.dataset ? b.dataset.s || s : s));
  // re-build scope row with proper data-s
  const row = document.querySelector('.scope-row');
  if (row) row.querySelectorAll('.sc-pill').forEach((b,i) => {
    const sc = P.SCOPES[i]; b.classList.toggle('sel', sc === s); b.onclick = () => setEditScope(sc);
  });
  const n = P.byId(editId); if (n) n._pendingScope = s;
}
function setEditEnergy(e) {
  editDirty = true;
  document.querySelectorAll('.en-pill').forEach(b => b.classList.remove('sel'));
  event.target.classList.add('sel');
}
function toggleEditPillar(p) {
  editDirty = true;
  event.target.classList.toggle('sel');
}

function saveEdit() {
  if (!editId) return;
  const n = P.byId(editId); if (!n) return;
  const name    = document.getElementById('editName').value.trim();
  const date    = document.getElementById('editDate').value || null;
  const time    = document.getElementById('editTime').value || null;
  const doneWhen= document.getElementById('editDoneWhen').value.trim() || null;
  const notes   = document.getElementById('editNotes').value.trim() || null;
  const pillars = [...document.querySelectorAll('.sp-pill.sel')].map(b => {
    return P.PILLARS.find(p => PILLAR_LABEL[p] === b.textContent.trim()) || b.textContent.trim().toLowerCase();
  });
  const scope  = (document.querySelector('.sc-pill.sel') || {}).textContent;
  const bucket = Object.keys(P.SCOPE_LABEL).find(k => P.SCOPE_LABEL[k] === scope) || n.bucket;
  const eBtn   = document.querySelector('.en-pill.sel');
  const energyLevel = eBtn ? (['H','M','L'].find(e => eBtn.classList.contains(e)) || null) : n.energyLevel;
  if (name) P.update(editId, { name, pillars, bucket, date, time, doneWhen, notes, energyLevel });
  forceCloseEdit();
}

function tryCloseEdit() {
  if (editDirty) {
    if (!confirm('Discard changes?')) return;
  }
  forceCloseEdit();
}
function forceCloseEdit() {
  editId = null; editDirty = false;
  document.getElementById('msheetBack').classList.remove('open');
  document.getElementById('msheet').classList.remove('open');
}

// ── Delete + undo ──────────────────────────────────────────────
function confirmDelete(id) {
  const n = P.byId(id); if (!n) return;
  const kids = P.leaves(id).length > 1 ? ' and all ' + P.leaves(id).length + ' steps inside' : '';
  if (!confirm('Remove "' + n.name + '"' + kids + '?')) return;
  // snapshot for undo
  const snap = JSON.stringify(P.all().filter(x => {
    let cur = x; while (cur) { if (cur.id === id) return true; cur = P.byId(cur.parentId); } return false;
  }));
  undoStack = { id, snap, name: n.name };
  P.remove(id);
  forceCloseEdit();
  showUndo('Removed "' + n.name + '".');
}
function showUndo(msg) {
  const t = document.getElementById('undoToast');
  document.getElementById('undoMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._undoTimer);
  window._undoTimer = setTimeout(() => { t.classList.remove('show'); undoStack = null; }, 5000);
}
function doUndo() {
  if (!undoStack) return;
  // Restore: re-add nodes (simplified — addRoot/addChild one by one)
  try {
    const nodes = JSON.parse(undoStack.snap);
    nodes.forEach(n => {
      if (!P.byId(n.id)) {
        if (!n.parentId) P.addRoot(n.name, Object.assign({}, n));
        else P.addChild(n.parentId, n.name, Object.assign({}, n));
      }
    });
  } catch(e) {}
  undoStack = null;
  document.getElementById('undoToast').classList.remove('show');
}

// ── Split ──────────────────────────────────────────────────────
function suggestSteps(name) {
  const n = name.toLowerCase();
  if (n.includes('test') || n.includes('exam'))   return ['Book the test','Practice session','Review notes','Take the test'];
  if (n.includes('learn') || n.includes('study'))  return ['Find a resource','Complete first session','Practice','Review progress'];
  if (n.includes('buy') || n.includes('purchase')) return ['Research options','Compare prices','Make the purchase'];
  if (n.includes('call') || n.includes('contact')) return ['Prepare what to say','Make the call','Follow up'];
  return ['First step','Next step','Final step'];
}

function openSplit(id, n, useAI) {
  forceCloseEdit();
  let steps = useAI ? suggestSteps(n.name).map(s => ({name:s,keep:true})) : [];
  document.getElementById('editTitle').textContent = 'Split: ' + n.name;
  document.getElementById('editParent').textContent = 'Each step becomes its own card.';
  document.getElementById('msheetBack').classList.add('open');
  document.getElementById('msheet').classList.add('open');

  function renderSplit() {
    const body = document.getElementById('editBody');
    let html = '<div id="splitSteps">';
    steps.forEach((s,i) => {
      html += `<div class="split-step-row">` +
        `<span class="split-step-name${s.keep?'':' off'}">${s.name}</span>` +
        `<button class="split-keep-btn" onclick="toggleSplitStep(${i})" ` +
        `style="border:1px solid ${s.keep?'var(--accent)':'var(--line)'};background:${s.keep?'color-mix(in srgb,#768471 12%,transparent)':'var(--greige)'};color:${s.keep?'var(--accent)':'var(--muted)'}">` +
        `${s.keep?'Keep':'Off'}</button></div>`;
    });
    html += '</div>';
    html += `<div style="display:flex;gap:8px;margin:10px 0">` +
      `<input id="splitInput" class="add-field" placeholder="Add a step…" style="flex:1;margin:0"/>` +
      `<button onclick="addSplitStep()" style="width:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:18px;color:var(--accent);cursor:pointer">+</button></div>`;
    body.innerHTML = html;

    const actions = document.getElementById('editActions');
    actions.innerHTML = '';
    const kept = steps.filter(s => s.keep);
    const applyBtn = document.createElement('button'); applyBtn.className = 'btn-prim';
    applyBtn.textContent = kept.length ? 'Split into ' + kept.length + ' steps' : 'Add steps above';
    applyBtn.disabled = !kept.length;
    applyBtn.onclick = () => {
      kept.forEach(s => P.addChild(id, s.name, {bucket: n.bucket, pillars: n.pillars}));
      forceCloseEdit();
    };
    actions.appendChild(applyBtn);
    const back = document.createElement('button'); back.className = 'ib'; back.style.cssText='width:100%;margin-top:6px;justify-content:center;';
    back.innerHTML = '<span style="font-size:var(--fs-sm);font-weight:700">Back</span>'; back.onclick = () => openEdit(id);
    actions.appendChild(back);
  }

  window.toggleSplitStep = i => { steps[i].keep = !steps[i].keep; renderSplit(); };
  window.addSplitStep = () => {
    const inp = document.getElementById('splitInput');
    const name = inp.value.trim(); if (!name) return;
    steps.push({name, keep:true}); inp.value = ''; renderSplit();
  };
  renderSplit();
}

// ── Main render ────────────────────────────────────────────────
function render() {
  renderPillarFilter();
  renderBoard();
  renderLater();
}

P.subscribe(render);
render();
</script>
